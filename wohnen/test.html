<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wohnen, Bauen und CO₂ – Prüfung</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #0b1220; color: #e8eefc; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: #93a0bd; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 980px; }
  td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #26324d; vertical-align: top; }
  .ok { color: #4ade80; font-weight: 700; } .fail { color: #ff6b6b; font-weight: 700; }
  #summary { font-size: 1.2rem; margin: 16px 0; }
  iframe { width: 960px; height: 540px; border: 1px solid #26324d; margin-top: 16px; }
</style>
</head>
<body>
<h1>Wohnen, Bauen und CO₂ · Abnahmetests</h1>
<p>Prüft das Modell (Zahlen aus dem Raster), die Texte im CO₂-Block und – in der eingebetteten App – zehnmaliges Wechseln aller Modi.</p>
<div id="summary">Prüfe …</div>
<table><thead><tr><th>Prüfung</th><th>Ergebnis</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="app" src="index.html" title="App für den Wechseltest"></iframe>
<script type="module">
import { CONFIG } from './config.js';
import { experimentZahlen, experimentModule, variantenZahlen, gebaeude, plan } from './model.js';

const rows = [];
const check = (name, ok, detail = '') => rows.push({ name, ok: !!ok, detail });

// Experiment
const n = experimentZahlen('nebeneinander'), s = experimentZahlen('gestapelt');
check('Experiment nebeneinander: 6 Wohnungen, 6 belegt, 0 frei geworden', n.wohnungen === 6 && n.belegt === 6 && n.freiGeworden === 0, `${n.wohnungen} / ${n.belegt} / ${n.freiGeworden}`);
check('Experiment gestapelt: 6 Wohnungen, 2 belegt, 4 frei geworden', s.wohnungen === 6 && s.belegt === 2 && s.freiGeworden === 4, `${s.wohnungen} / ${s.belegt} / ${s.freiGeworden}`);
const st = experimentModule('gestapelt');
const tuerme = {};
for (const m of st) (tuerme[`${m.x},${m.z}`] = tuerme[`${m.x},${m.z}`] || []).push(m.etage);
check('Gestapelt: zwei Gebäude mit je drei Etagen (0, 1, 2)', Object.keys(tuerme).length === 2 && Object.values(tuerme).every((e) => e.sort().join() === '0,1,2'), JSON.stringify(tuerme));
check('Experiment: Grundstück quadratisch', Number.isInteger(Math.sqrt(n.felder)), `${CONFIG.raster.experimentFelder} × ${CONFIG.raster.experimentFelder} Modulfelder`);

// Varianten
const groesse = new Set();
for (const v of ['A', 'B', 'C']) {
  const z = variantenZahlen(v), p = plan(v);
  groesse.add(`${p.length}×${p[0].length}`);
  check(`Variante ${v}: genau 6 Wohnungen`, z.wohnungen === 6, `${z.gebaeude} Gebäude × ${CONFIG.varianten[v].geschosse} Etage(n)`);
  check(`Variante ${v}: Flächen ergeben das ganze Grundstück`, z.bebaut + z.unbebaut === z.gesamt && z.gruen + z.wege === z.unbebaut, `bebaut ${z.bebaut} + unbebaut ${z.unbebaut} = ${z.gesamt}; Grün ${z.gruen} + Wege ${z.wege}`);
  check(`Variante ${v}: jede Zeile des Plans gleich lang`, p.every((r) => r.length === p.length));
  check(`Variante ${v}: Gebäude passen ins Modulraster (2 × 2)`, gebaeude(v).every((g) => g.felder % 4 === 0 && (g.x1 - g.x0 + 1) % 2 === 0 && (g.z1 - g.z0 + 1) % 2 === 0));
}
check('A, B, C: dasselbe Grundstück', groesse.size === 1, [...groesse].join(', '));
const a = variantenZahlen('A'), b = variantenZahlen('B'), c = variantenZahlen('C');
check('Grünflächen-Nutzung unterscheidbar: A privat, B gemeinsam, C öffentlich',
  a.privat > 0 && a.gemeinsam === 0 && a.oeffentlich === 0 && b.gemeinsam > 0 && b.privat === 0 && b.oeffentlich === 0 && c.oeffentlich > 0 && c.privat === 0 && c.gemeinsam === 0,
  `A ${a.gruenTyp} ${a.privat} · B ${b.gruenTyp} ${b.gemeinsam} · C ${c.gruenTyp} ${c.oeffentlich}`);

// CO₂-Block: keine Zahlen, keine Prozent, keine Pauschalaussagen
const au = CONFIG.aufstocken;
const co2Texte = [au.frage, au.einsparen, au.bilanz, au.abwaegen, au.check.frage, au.check.antwort, ...au.karten.map((k) => k.text), ...Object.values(au.labels)];
check('CO₂-Block: keine Zahlen oder Prozentwerte', co2Texte.every((t) => !/[0-9%]/.test(t)), co2Texte.filter((t) => /[0-9%]/.test(t)).join(' | ') || 'keine');
const verboten = [/immer\s+CO₂-neutral/i, /immer\s+schlecht/i, /klimaneutral/i, /spart\s+\d/i];
check('CO₂-Block: keine Pauschalaussagen („immer CO₂-neutral“, „immer schlecht“ …)', co2Texte.every((t) => !verboten.some((r) => r.test(t)) || /Kein Baustoff ist immer/.test(t)));
check('Infokarten Holz, Beton/Zement, Bestand mit Originaltext', au.karten.map((k) => k.titel).join() === 'Holz,Beton/Zement,Bestand' && au.karten[0].text.startsWith('Bäume nehmen beim Wachsen CO₂ auf.'));

function zeigen() {
  const bad = rows.filter((r) => !r.ok).length;
  document.getElementById('summary').innerHTML = bad ? `<span class="fail">✗ ${bad} von ${rows.length} Prüfungen fehlgeschlagen</span>` : `<span class="ok">✓ Alle ${rows.length} Prüfungen bestanden</span>`;
  document.getElementById('rows').innerHTML = rows.map((r) => `<tr><td>${r.name}</td><td class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✓' : '✗'}</td><td>${r.detail}</td></tr>`).join('');
  window.__testErgebnis = { bestanden: rows.length - bad, gesamt: rows.length, rows };
}
zeigen();

// Wechseltest in der eingebetteten App: 10 × alle fünf Modi (mit Teilschritten), danach Zustand vergleichen
const frame = document.getElementById('app');
frame.addEventListener('load', async () => {
  const w = frame.contentWindow;
  for (let i = 0; i < 100 && !w.__wohnenOk; i++) await new Promise((r) => setTimeout(r, 100));
  if (!w.__wohnenOk) { check('Wechseltest: App geladen', false, 'App nicht geladen'); return zeigen(); }
  const api = w.__wohnen, welt = api.welt();
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const runde = async (ms = 20) => {
    for (const m of ['experiment', 'A', 'B', 'C', 'aufstocken']) {
      api.modus(m);
      api.weiter(1); api.weiter(1);
      await pause(ms);
    }
    api.modus('vergleich'); await pause(ms);
    api.modus('start'); await pause(ms);
  };
  // Aufwärmen: jede Szene so lange zeigen, dass sie sicher einmal gezeichnet und auf die Grafikkarte geladen wird
  await runde(400);
  api.modus('experiment'); await pause(3500);
  const vorher = welt.info();
  for (let i = 0; i < 10; i++) await runde();
  api.modus('experiment'); await pause(3500);
  const nachher = welt.info();
  check('10 × alle Modi wechseln: keine zusätzlichen Objekte', nachher.objekte === vorher.objekte, `${vorher.objekte} → ${nachher.objekte} Objekte`);
  check('… keine zusätzlichen Geometrien oder Texturen im Speicher', nachher.geometrien === vorher.geometrien && nachher.texturen === vorher.texturen, `Geometrien ${vorher.geometrien} → ${nachher.geometrien}, Texturen ${vorher.texturen} → ${nachher.texturen}`);
  check('… genau eine Szene sichtbar', nachher.sichtbar.length === 1 && nachher.sichtbar[0] === 'experiment', nachher.sichtbar.join(', '));
  const z = api.experimentZahlen(api.S.exp.anzeige);
  check('… Experiment danach im Ausgangszustand (6 / 6 / 0)', z.belegt === 6 && z.freiGeworden === 0 && api.S.exp.zustand === 'nebeneinander', `${z.wohnungen} / ${z.belegt} / ${z.freiGeworden}`);
  zeigen();
});
</script>
</body>
</html>
