<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMARTy – Soundboard · START IT SMART</title>
<meta name="description" content="Regie-Soundboard für START IT SMART: einzelne Sprachclips von SMARTy und der Zeitmaschinen-KI nach Drehbuch.">
<meta name="theme-color" content="#0a4d52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23017374'/%3E%3Cpath d='M24 18v28l22-14z' fill='%23ffbd59'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<script src="symbole.js"></script>
<header class="kopf">
  <img class="logo" src="bilder/start-it-smart-logo.png" alt="START IT SMART" width="464" height="72">
  <span class="trenner" aria-hidden="true"></span>
  <div>
    <h1>SMARTy – Soundboard</h1>
    <p>Sprachclips von SMARTy und der Zeitmaschinen-KI · Reihenfolge nach Drehbuch</p>
  </div>
  <div class="rechts">
    <a class="kopf-link" href="show.html" target="smarty-show" title="Filme, Stadtkonfigurator, Simulationen, Minecraft, Calliope und Präsentation (eigener Tab)">Show-Zentrale <svg class="ico"><use href="#i-weiter"/></svg></a>
  </div>
</header>

<nav class="leiste" aria-label="Auswahl">
  <div class="sprecherwahl" role="group" aria-label="Sprecher">
    <button type="button" data-sprecher="alle" aria-pressed="true">Alle</button>
    <button type="button" data-sprecher="smarty" aria-pressed="false"><svg class="ico"><use href="#i-hund"/></svg>SMARTy</button>
    <button type="button" data-sprecher="ki" aria-pressed="false"><svg class="ico"><use href="#i-chip"/></svg>Zeitmaschinen-KI</button>
  </div>
  <div class="missionswahl" id="missionswahl" aria-label="Missionen"></div>
</nav>

<main class="liste" id="liste">
  <p class="hilfe">Clips werden geladen …</p>
</main>

<footer class="pult" aria-label="Wiedergabe">
  <div class="jetzt">
    <div class="jetzt-zeile" id="jetzt" role="status">Bereit · kein Clip läuft</div>
    <div class="balken" aria-hidden="true"><span id="balken"></span></div>
  </div>
  <button type="button" class="knopf stopp" id="stoppAlles" title="Laufenden Clip sofort stoppen"><svg class="ico"><use href="#i-stopp"/></svg>Stopp <kbd>Leertaste</kbd></button>
  <label class="laut"><svg class="ico" aria-hidden="true"><use href="#i-laut"/></svg><span>Lautstärke</span>
    <input type="range" id="lautstaerke" min="0" max="150" step="1" value="100">
    <output id="lautWert" for="lautstaerke">100 %</output>
  </label>
</footer>

<script src="regie.js"></script>
</body>
</html>
