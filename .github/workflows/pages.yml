name: Sprachdateien erzeugen und Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Sprachdateien erzeugen (nur neue oder geänderte Sätze)
        id: generate
        continue-on-error: true
        run: python tools/generate.py

      - name: Neue Sprachdateien ins Repository übernehmen
        run: |
          if [ -n "$(git status --porcelain audio)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audio
            git commit -m "Sprachdateien aktualisiert [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Hinweis bei Fehler in der Spracherzeugung
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::warning::Mindestens ein Satz konnte nicht erzeugt werden. Details im Schritt 'Sprachdateien erzeugen'."
