<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aus Grau wird Grün – Prüfung</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #0b1220; color: #e8eefc; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: #93a0bd; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 980px; }
  td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #26324d; vertical-align: top; }
  .ok { color: #4ade80; font-weight: 700; } .fail { color: #ff6b6b; font-weight: 700; }
  #summary { font-size: 1.2rem; margin: 16px 0; }
  iframe { width: 960px; height: 540px; border: 1px solid #26324d; margin-top: 16px; max-width: 100%; }
</style>
</head>
<body>
<h1>Aus Grau wird Grün · Abnahmetests</h1>
<p>Prüft Modell (Blöcke, Wärme, Wasser, Verwandlung), Texte nach Drehbuch und – in der eingebetteten App – zehnmaliges Wechseln aller Abschnitte.</p>
<div id="summary">Prüfe …</div>
<table><thead><tr><th>Prüfung</th><th>Ergebnis</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="app" src="index.html" title="App für den Wechseltest"></iframe>
<script type="module">
import { CONFIG as C } from './config.js';
import { VORLAGEN, sichtbareBloecke, waerme, waermeAnteile, imSchatten, bodenHoehe, Wasser, aufbau, schichtWuchs, GROESSE, ID } from './model.js';
import { vorlageGrau, vorlageGruen } from '../minecraft/welt.js';

const rows = [];
const check = (name, ok, detail = '') => rows.push({ name, ok: !!ok, detail });

// Gleiche Gestaltung wie die Minecraft-Testwelt
const gleich = (a, b) => a.daten.length === b.daten.length && a.daten.every((v, k) => v === b.daten[k]);
check('Gleiche Vorlagen wie die Minecraft-Testwelt (grau und grün)', gleich(VORLAGEN.grau, vorlageGrau()) && gleich(VORLAGEN.gruen, vorlageGruen()), `${GROESSE.dx} × ${GROESSE.dy} × ${GROESSE.dz} Blöcke`);

// Sichtbare Blöcke
const sg = sichtbareBloecke(VORLAGEN.grau), sn = sichtbareBloecke(VORLAGEN.gruen);
check('Sichtbare Blöcke: ohne Wasser und Schilder (Wasser kommt als Füllstand)', [...sg, ...sn].every((b) => b.form !== 'wasser' && b.form !== 'keine'), `grau ${sg.length}, grün ${sn.length}`);
check('Grau: keine Pflanzen, kein Laub', sg.every((b) => b.form !== 'pflanze' && !b.laub));
check('Grün: Bäume (Laub), Pflanzen und Glasdeckel der Zisterne sichtbar', sn.filter((b) => b.laub).length > 100 && sn.filter((b) => b.form === 'pflanze').length > 50 && sn.some((b) => b.form === 'glas'));
const schnitt = (l) => l.filter((b) => b.y < 4 && (b.x === GROESSE.dx - 1 || b.z === GROESSE.dz - 1)).length;
check('Bodenschnitt vorne sichtbar (Süd- und Ostkante, 4 Schichten)', schnitt(sg) === 4 * 63 && schnitt(sn) === 4 * 63, `${schnitt(sg)} / ${schnitt(sn)} Blöcke`);

// Wärme
const wg = waermeAnteile(VORLAGEN.grau), wn = waermeAnteile(VORLAGEN.gruen);
check('Wärme grau: fast alles „heiß“ (Stein in der Sonne)', wg.heiss / 1024 > 0.85, JSON.stringify(wg));
check('Wärme grün: nichts „heiß“, deutlich mehr Schatten als grau', wn.heiss === 0 && wn.kuehl > wg.kuehl + 60, JSON.stringify(wn));
const baum = [4, 27];
const schattenUnterBaum = waerme(VORLAGEN.gruen).filter((f) => Math.abs(f.x - baum[0]) <= 3 && Math.abs(f.z - baum[1]) <= 4 && f.art === 'kuehl').length;
check('Unter dem Baum vorne links ist es schattig', schattenUnterBaum >= 6, `${schattenUnterBaum} schattige Felder`);
check('Wärme ohne Zahlen (Legende und Hinweis)', C.sommer.waerme.legende.every(([, t]) => !/\d/.test(t)) && /keine Messwerte/.test(C.sommer.waerme.hinweis));

// Wasser
const w = new Wasser(C.dauer);
w.reset('grau'); w.regen = true; for (let k = 0; k < 200; k++) w.schritt(0.1);
check('Starkregen grau: Wasser fließt ab, nichts versickert oder wird gesammelt', w.abfluss > 0.99 && w.mulde === 0 && w.tief === 0 && w.zisterne === 0 && w.versickern === 0, `Abfluss ${w.abfluss.toFixed(2)}`);
w.reset('gruen', 0.3); w.regen = true;
let gesperrtWaehrend = false; for (let k = 0; k < 200; k++) { w.schritt(0.1); gesperrtWaehrend ||= w.gesperrt; }
check('Starkregen grün: versickert, Mulde und tiefer Bereich füllen sich, Zisterne sammelt', w.versickern > 0.99 && w.mulde > 0.99 && w.tief > 0.99 && w.zisterne > 0.99 && w.abfluss === 0 && gesperrtWaehrend, `Mulde ${w.mulde.toFixed(2)}, tief ${w.tief.toFixed(2)}, Zisterne ${w.zisterne.toFixed(2)}`);
w.regen = false; for (let k = 0; k < 300; k++) w.schritt(0.1);
check('Regen vorbei: Mulde und tiefer Bereich leer (wieder bespielbar), Zisterne bleibt voll', w.mulde === 0 && w.tief === 0 && !w.gesperrt && w.zisterne > 0.99, `Zisterne ${w.zisterne.toFixed(2)}`);
w.giessen = true; for (let k = 0; k < 100; k++) w.schritt(0.1);
check('Gießen: Zisterne gibt Wasser ab, bleibt aber nicht leer', w.gegossen === 1 && w.zisterne < 0.99 && w.zisterne >= 0.25, `Zisterne ${w.zisterne.toFixed(2)}`);
check('Wassertexte ohne Mengenangaben', Object.values(C.regen.labels).concat(C.regen.versiegelt, C.regen.offen).every((t) => !/\d|Liter|%/.test(t)));

// Verwandlung
const D = C.dauer.verwandeln;
const pkte = Array.from({ length: 50 }, (_, k) => aufbau(k * D / 49, D));
check('Verwandlung: beginnt grau, endet vollständig grün, Schicht für Schicht', pkte[0] === 0 && pkte.at(-1) === GROESSE.dy + 1 && pkte.every((v, k) => k === 0 || v >= pkte[k - 1]) && schichtWuchs(0, 0) === 0 && schichtWuchs(GROESSE.dy + 1, GROESSE.dy - 1) === 1, `${D} s, ${GROESSE.dy} Schichten`);

// Texte nach Drehbuch
check('Drehbuch-Fragen wörtlich', C.grau.fragen[0] === 'Würdet ihr hier nachmittags gerne spielen?' && C.abstimmung.frage === 'Müssen wir uns wirklich zwischen Spielen und Natur entscheiden?' && C.sommer.frage.startsWith('Wo würdet ihr euch an einem heißen Sommertag lieber aufhalten'));
check('Abstimmung genau wie im Drehbuch: A Abenteuerspielplatz, B grüner Abenteuerpark', C.abstimmung.karten.map((k) => k.id + ' ' + k.titel).join(' | ') === 'A Großer Abenteuerspielplatz | B Grüner Abenteuerpark');
check('Endbild: vier Punkte aus dem Drehbuch', C.ende.punkte.join(', ') === 'Schatten im Sommer, Platz für Tiere, Spielen mit Freunden, Hilfe bei Starkregen');
check('Keine Figur „Mika“', !JSON.stringify(C).includes('Mika'));

function zeigen() {
  const bad = rows.filter((r) => !r.ok).length;
  document.getElementById('summary').innerHTML = bad ? `<span class="fail">✗ ${bad} von ${rows.length} Prüfungen fehlgeschlagen</span>` : `<span class="ok">✓ Alle ${rows.length} Prüfungen bestanden</span>`;
  document.getElementById('rows').innerHTML = rows.map((r) => `<tr><td>${r.name}</td><td class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✓' : '✗'}</td><td>${r.detail}</td></tr>`).join('');
  window.__testErgebnis = { bestanden: rows.length - bad, gesamt: rows.length, fertig: rows.some((r) => r.name.startsWith('…')) };
}
zeigen();

// Wechseltest in der eingebetteten App
const frame = document.getElementById('app');
frame.addEventListener('load', async () => {
  const fw = frame.contentWindow;
  for (let i = 0; i < 100 && !fw.__naturOk; i++) await new Promise((r) => setTimeout(r, 100));
  if (!fw.__naturOk) { check('… App geladen', false, 'App nicht geladen'); return zeigen(); }
  const api = fw.__natur, welt = api.welt();
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const runde = async (ms = 30) => {
    api.modus('grau'); api.weiter(1); await pause(ms);
    api.modus('abstimmung'); api.waehlen('A'); api.weiter(1); await pause(ms);
    api.modus('beides'); api.weiter(1); await pause(ms);
    api.modus('sommer'); api.weiter(1); api.waermeUmschalten(); api.weiter(1); await pause(ms);
    api.modus('regen'); api.weiter(1); await pause(ms); api.weiter(1); api.weiter(1); await pause(ms);
    api.modus('ende'); await pause(ms);
    api.modus('start'); await pause(ms);
  };
  await runde(400);                                  // Aufwärmen: alles einmal zeichnen
  api.modus('ende'); await pause(1500);
  const vorher = welt.info();
  for (let i = 0; i < 10; i++) await runde();
  api.modus('ende'); await pause(1500);
  const nachher = welt.info();
  check('… 10 × alle Abschnitte: keine zusätzlichen Objekte', nachher.objekte === vorher.objekte, `${vorher.objekte} → ${nachher.objekte}`);
  check('… keine zusätzlichen Geometrien oder Texturen', nachher.geometrien === vorher.geometrien && nachher.texturen === vorher.texturen, `Geometrien ${vorher.geometrien} → ${nachher.geometrien}, Texturen ${vorher.texturen} → ${nachher.texturen}`);
  check('… Endbild danach grün, kein Regen', nachher.zustand === 'gruen' && nachher.sichtbarGruen === GROESSE.dy && nachher.sichtbarGrau === 0 && !welt.regen.visible);
  // Abbruch mitten in der Verwandlung darf keinen halben Platz hinterlassen
  api.modus('beides'); api.weiter(1); await pause(1500);
  const mitten = welt.info();
  api.modus('grau'); await pause(200);
  const danach = welt.info();
  check('… Abbruch mitten in der Verwandlung: wieder ganz grau', mitten.verwandlung && !danach.verwandlung && danach.sichtbarGrau === GROESSE.dy && danach.sichtbarGruen === 0, `mitten: ${mitten.sichtbarGrau} grau / ${mitten.sichtbarGruen} grün`);
  api.modus('beides'); api.weiter(1); await pause((C.dauer.verwandeln + 0.8) * 1000);
  const fertig = welt.info();
  check('… Verwandlung läuft vollständig durch', !fertig.verwandlung && fertig.zustand === 'gruen' && fertig.sichtbarGruen === GROESSE.dy && fertig.sichtbarGrau === 0);
  zeigen();
});
</script>
</body>
</html>
