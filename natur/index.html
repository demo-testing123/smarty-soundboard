<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensorlabor Regenwasser</title>
<meta name="description" content="3D-Simulation „Sensorlabor Regenwasser“ für START IT SMART – Mission Natur: Starkregen, Wasser speichern, Trockenheit, Bewässern mit einer einfachen Regel.">
<meta name="theme-color" content="#123c46">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='40' width='52' height='16' fill='%2379b04a'/%3E%3Crect x='36' y='14' width='16' height='30' rx='3' fill='%232f8fd8'/%3E%3Cpath d='M20 10c6 9 9 14 9 19a9 9 0 0 1-18 0c0-5 3-10 9-19z' fill='%232f8fd8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="buehne">
    <header class="kopf">
      <h1 id="titel">Mission Natur · Sensorlabor Regenwasser</h1>
      <span id="kennzeichnung" class="kennzeichnung"></span>
      <button type="button" id="vollbild" class="vollbild" title="Vollbild (F)" aria-label="Vollbild">⛶</button>
    </header>

    <section class="mitte">
      <div class="szene">
        <div id="welt" aria-label="3D-Modell des Spielplatzes"></div>
        <div id="lbl1" class="label" hidden></div>
        <div id="lbl2" class="label" hidden></div>
        <div id="lbl3" class="label" hidden></div>
        <p id="schrittText" class="schritt-text" aria-live="polite"></p>
      </div>

      <aside class="sensoren" aria-label="Sensoranzeigen">
        <h2>Sensoranzeigen</h2>
        <div class="anzeige" id="anzeigeWasser">
          <div class="a-titel" id="titelWasser"></div>
          <div class="a-wert"><b id="wertWasser">0</b><span>%</span></div>
          <div class="balken"><i id="balkenWasser"></i></div>
          <div class="a-status" id="statusWasser"></div>
        </div>
        <div class="anzeige" id="anzeigeFeuchte">
          <div class="a-titel" id="titelFeuchte"></div>
          <div class="a-wert"><b id="wertFeuchte">0</b><span>%</span></div>
          <div class="balken"><i id="balkenFeuchte"></i></div>
          <div class="a-status" id="statusFeuchte"></div>
        </div>
        <div id="regel" class="regel" hidden>
          <h3 id="regelTitel"></h3>
          <div class="bed" id="bed1"><i></i><span></span></div>
          <div class="und">UND</div>
          <div class="bed" id="bed2"><i></i><span></span></div>
          <div class="ergebnis" id="ergebnis"></div>
        </div>
      </aside>
    </section>

    <nav class="schritte" aria-label="Schritte">
      <button type="button" id="zurueck" class="pfeil" title="Zurück (←)">← Zurück</button>
      <div id="kacheln" class="kacheln"></div>
      <button type="button" id="weiter" class="pfeil weiter" title="Weiter (→)">Weiter →</button>
    </nav>

    <div id="laden" class="laden">Lade 3D-Modell …</div>
    <div id="fehler" class="fehler" hidden></div>
  </main>
</div>
<script>
  setTimeout(function () {
    if (window.__naturOk) return;
    var l = document.getElementById('laden'); if (l) l.hidden = true;
    var f = document.getElementById('fehler');
    if (f && f.hidden) { f.textContent = 'Die Anwendung konnte nicht geladen werden. Bitte über GitHub Pages oder einen lokalen Webserver öffnen (nicht per Doppelklick auf die Datei).'; f.hidden = false; }
  }, 8000);
</script>
<script type="module" src="main.js"></script>
</body>
</html>
